<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte de visite</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="card-wrapper">
    <img id="card-front" src="images/recto.png" alt="Recto">
    <img id="card-back" src="images/verso.png" alt="Verso">
  </div>

  <button id="downloadBtn" class="btn">Télécharger la carte</button>
</div>

<script>
const downloadBtn = document.getElementById('downloadBtn');
const frontImg = document.getElementById('card-front');
const backImg = document.getElementById('card-back');

downloadBtn.addEventListener('click', () => {
  if (!frontImg.complete || !backImg.complete) {
    alert("Les images ne sont pas encore chargées !");
    return;
  }

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  // Canvas largeur = max des deux images, hauteur = somme des deux
  canvas.width = Math.max(frontImg.naturalWidth, backImg.naturalWidth);
  canvas.height = frontImg.naturalHeight + backImg.naturalHeight;

  // Fond blanc
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Dessiner recto en haut
  ctx.drawImage(frontImg, 0, 0, frontImg.naturalWidth, frontImg.naturalHeight);

  // Dessiner verso en bas
  ctx.drawImage(backImg, 0, frontImg.naturalHeight, backImg.naturalWidth, backImg.naturalHeight);

  // Télécharger
  const link = document.createElement('a');
  link.download = "carte_de_visite.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
});
</script>

</body>
</html>
